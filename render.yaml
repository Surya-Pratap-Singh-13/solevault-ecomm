services:
  - type: web
    name: solevault-ecommerce
    runtime: python
    buildCommand: "bash build.sh"
    startCommand: "gunicorn shoestore.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
