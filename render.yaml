services:
  - type: web
    name: solevault-ecommerce
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn shoestore.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
